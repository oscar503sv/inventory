name: Build and PostgreSQL integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory_ci
          POSTGRES_PASSWORD: ci_ephemeral_password
          POSTGRES_DB: inventario_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_ci -d inventario_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=inventario_erp;Username=inventory_ci;Password=ci_ephemeral_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.100
            10.0.x
      - run: bash scripts/validate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
